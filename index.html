<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Spirograph 2D 3D</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0; height: 100%; overflow: hidden;
		background: #0b0e14; color: #cfd6e4;
		font: 12px/1.4 system-ui, sans-serif;
		touch-action: none;
	}
	#c {
		position: absolute; top: 50%; left: 50%;
		transform: translate(-50%, -50%);
		background: #0b0e14;
		box-shadow: 0 0 0 1px #1b2330, 0 8px 40px #0008;
		cursor: crosshair;
	}
	#panel {
		position: fixed; z-index: 10; left: 10px; top: 50%;
		transform: translateY(-50%);
		width: auto; max-width: 300px; padding: 12px; border-radius: 10px;
		background: #131a26e6; border: 1px solid #243044;
		backdrop-filter: blur(6px);
		max-height: calc(100vh - 20px); overflow-y: auto;
	}
	.levels { margin-top: 4px; }
	#panel.ptitle, .ptitle { font-weight: 600; margin-bottom: 8px; color: #fff; }
	.row label { display: flex; align-items: center; gap: 6px; color: #9fb0c8; }
	.row input[type=range] { flex: 1; min-width: 0; }
	/* checkbox rows: box first, then the label, on one line */
	.row input[type=checkbox] { flex: 0 0 auto; margin: 0; cursor: pointer; accent-color: #5a7fd0; }
	.row.inline { display: flex; align-items: center; gap: 6px; }
	.row.inline label { flex: 1 1 auto; min-width: 0; }
	.row select { flex: 1; min-width: 0; padding: 3px 6px; background: #1d2940; color: #dce6f7;
		border: 1px solid #2e3d59; border-radius: 7px; font: inherit; }
	.row .val { flex: 0 0 40px; text-align: right; color: #e8eefc; font-variant-numeric: tabular-nums; }
	/* sections of the panel and of the gear menu: a title band over striped
	   rows - the zebra rhythm of a table, one table per logical group */
	.group {
		margin: 8px 0; border: 1px solid #243044; border-radius: 9px;
		background: #101827; overflow: hidden;
	}
	.group > .gh {
		padding: 3px 8px; background: #1b2536; color: #93a6c4; font-size: 11px;
		font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
	}
	/* one band per row: the group zeroes the section margins rows carry */
	.group > :not(.gh) { margin: 0; padding: 3px 8px; }
	.group > :not(.gh):nth-child(even) { background: #17202f; }
	.group > :last-child { padding-bottom: 6px; }
	/* gear tree: one row per gear, nested by parent, click opens its menu */
	.group > .tree { max-height: 30vh; overflow-y: auto; padding: 2px 0 4px; }
	.tnode { display: flex; align-items: center; gap: 5px; padding: 2px 8px;
		cursor: pointer; color: #9fb0c8; }
	.tnode:hover { background: #24314a; }
	.tnode.sel { background: #3a5a9a; color: #fff; }
	.tnode .chip { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%;
		box-shadow: 0 0 0 1px #0009; }
	.tnode .tp { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
	.tnode .tg { flex: 1 1 auto; min-width: 0; font-size: 11px; color: #7e8ca6; }
	.tnode.sel .tg { color: #dbe6fa; }
	.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
	.btn, button {
		flex: 1 1 auto; min-width: 0; padding: 5px 8px; cursor: pointer;
		background: #1d2940; color: #dce6f7; white-space: nowrap;
		border: 1px solid #2e3d59; border-radius: 7px; font: inherit;
	}
	.btn:hover, button:hover { background: #26365a; }
	.btn:disabled, button:disabled { opacity: .4; cursor: default; }
	.btn.active, button.active { background: #3a5a9a; border-color: #5a7fd0; color: #fff; }
	.sub { margin-top: 10px; color: #7e8ca6; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
	.lvl-indent { padding-left: 10px; }
	.auto { margin-top: 8px; color: #6fe0a0; font-size: 11px; }
	.auto.bad { color: #ff8a8a; }
	.help { margin-top: 10px; color: #6b7896; font-size: 11px; }
	#ctxmenu {
		position: fixed; z-index: 20; width: 264px; padding: 12px;
		border-radius: 10px; background: #131a26f2; border: 1px solid #2e3d59;
		backdrop-filter: blur(6px); box-shadow: 0 10px 40px #000a;
	}
	#ctxmenu.hidden { display: none; }
	#ctxmenu .drag { cursor: grab; }
	#ctxmenu .drag:active { cursor: grabbing; }
	#toast {
		position: fixed; z-index: 30; bottom: 18px; left: 50%; transform: translateX(-50%);
		padding: 8px 14px; border-radius: 8px; background: #1d2940ee; border: 1px solid #2e3d59;
		color: #e8eefc; opacity: 0; transition: opacity .2s; pointer-events: none;
	}
	#toast.show { opacity: 1; }
	@media (max-aspect-ratio: 1/1) {
		#panel { top: 8px; left: 8px; right: 8px; width: auto; transform: none;
			max-height: 46vh; }
	}
</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="panel"></div>
	<div id="ctxmenu" class="hidden"></div>
	<div id="toast"></div>

	<script src="js/settings.js"></script>
	<script src="js/gear.js"></script>
	<script src="js/render.js"></script>
	<script src="js/camera3.js"></script>
	<script src="js/gui.js"></script>
	<!-- startup scene + preset list: save/default.js sets SETTINGS (the scene
	     that loads whenever there is no autosave) and PRESETS (the panel's
	     preset dropdown). every scene file lives in save/. two ways to collect
	     presets (run the script from this dir):
	     1. single file: save/presets_merge_to_default.js.py - the scene files
	        in save/ are merged into save/default.js and the consumed files are
	        renamed *.delete-me.
	     2. multi file: save/link_presets_to_html.py - the scene files stay in
	        save/ and are inserted below (between save/default.js and
	        js/main.js) as <script ... class="preset"> tags. those tags are
	        managed by the script: renaming or deleting a file and re-running
	        moves or drops its tag. do not edit the class="preset" tags by
	        hand. -->
	<script src="save/default.js"></script>
	<script src="save/3d-whole-spheres.js" class="preset"></script>
	<script src="save/3d-tails-whole-rainbow2.js" class="preset"></script>
	<script src="save/3d-whole-rainbow-sequence.js" class="preset"></script>
	<script src="js/main.js"></script>
</body>
</html>
