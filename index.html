<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Spirograph</title>
<style>
	* { box-sizing: border-box; }
	html, body {
		margin: 0; height: 100%; overflow: hidden;
		background: #0b0e14; color: #cfd6e4;
		font: 13px/1.4 system-ui, sans-serif;
		-webkit-user-select: none; user-select: none;
		touch-action: none;
	}
	#c {
		position: absolute; top: 50%; left: 50%;
		transform: translate(-50%, -50%);
		background: #0b0e14;
		box-shadow: 0 0 0 1px #1b2330, 0 8px 40px #0008;
		cursor: crosshair;
	}
	#panel {
		position: fixed; z-index: 10; left: 10px; top: 50%;
		transform: translateY(-50%);
		width: auto; max-width: 300px; padding: 12px; border-radius: 10px;
		background: #131a26e6; border: 1px solid #243044;
		backdrop-filter: blur(6px);
		max-height: calc(100vh - 20px); overflow-y: auto;
	}
	.levels { margin-top: 4px; }
	#panel.ptitle, .ptitle { font-weight: 600; margin-bottom: 8px; color: #fff; }
	.row { margin: 5px 0; }
	.row label { display: flex; align-items: center; gap: 6px; color: #9fb0c8; }
	.row input[type=range] { flex: 1; min-width: 0; }
	.row .val { flex: 0 0 40px; text-align: right; color: #e8eefc; font-variant-numeric: tabular-nums; }
	.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
	.btn, button {
		flex: 1 1 auto; min-width: 0; padding: 5px 8px; cursor: pointer;
		background: #1d2940; color: #dce6f7; white-space: nowrap;
		border: 1px solid #2e3d59; border-radius: 7px; font: inherit;
	}
	.btn:hover, button:hover { background: #26365a; }
	.btn:disabled, button:disabled { opacity: .4; cursor: default; }
	.btn.active, button.active { background: #3a5a9a; border-color: #5a7fd0; color: #fff; }
	.sub { margin-top: 10px; color: #7e8ca6; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
	.lvl-indent { padding-left: 10px; }
	.auto { margin-top: 8px; color: #6fe0a0; font-size: 11px; }
	.auto.bad { color: #ff8a8a; }
	.help { margin-top: 10px; color: #6b7896; font-size: 11px; }
	#ctxmenu {
		position: fixed; z-index: 20; width: 248px; padding: 12px;
		border-radius: 10px; background: #131a26f2; border: 1px solid #2e3d59;
		backdrop-filter: blur(6px); box-shadow: 0 10px 40px #000a;
	}
	#ctxmenu.hidden { display: none; }
	#ctxmenu .drag { cursor: grab; }
	#ctxmenu .drag:active { cursor: grabbing; }
	#toast {
		position: fixed; z-index: 30; bottom: 18px; left: 50%; transform: translateX(-50%);
		padding: 8px 14px; border-radius: 8px; background: #1d2940ee; border: 1px solid #2e3d59;
		color: #e8eefc; opacity: 0; transition: opacity .2s; pointer-events: none;
	}
	#toast.show { opacity: 1; }
	@media (max-aspect-ratio: 1/1) {
		#panel { top: 8px; left: 8px; right: 8px; width: auto; transform: none;
			max-height: 46vh; }
	}
</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="panel"></div>
	<div id="ctxmenu" class="hidden"></div>
	<div id="toast"></div>

	<script src="js/gear.js"></script>
	<script src="js/render.js"></script>
	<script src="js/gui.js"></script>
	<!-- optional startup scene: drop a saved scene (spirograph.js) next to this
	     file as default.js and it loads whenever there is no autosave -->
	<script src="default.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
